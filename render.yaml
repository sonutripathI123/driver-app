databases:
  - name: chauffeur-db
    databaseName: chauffeur_platform
    user: chauffeur_admin
    plan: free
    region: singapore

services:
  # 1. FastAPI 2.0 Backend Web Service
  - type: web
    name: chauffeur-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "Chauffeur Operations Platform"
      - key: DATABASE_URL
        fromDatabase:
          name: chauffeur-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@chauffeurplatform.com
      - key: DEFAULT_ADMIN_PASSWORD
        value: AdminSecurePassword123!

  # 2. React 3D Luxury Frontend Static Site
  - type: web
    name: chauffeur-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: chauffeur-backend
          property: host
